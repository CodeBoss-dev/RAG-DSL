[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptscript"
version = "0.1.0"
description = "A lightweight typed DSL for constructing RAG prompts"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "tiktoken>=0.6",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = [
    "openai>=1.0",
    "rank-bm25>=0.2",
    "rouge-score>=0.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scipy>=1.11",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
promptscript = "promptscript.cli:cli"
benchmark-run = "benchmark.pipeline:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["promptscript*", "benchmark*"]

[tool.ruff]
line-length = 100
target-version = "py310"
